services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      ALLOW_DEV_LOGIN: "false"
    entrypoint:
      - /app/docker/migrate.sh
    command: []
    networks:
      - default
      - dokploy-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      ALLOW_DEV_LOGIN: "false"
      PORT: "3001"
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "${AUTH_URL:-https://calafrio.wozniack.com}"
      NEXTAUTH_URL: "${AUTH_URL:-https://calafrio.wozniack.com}"
      AUTH_SECRET: "${AUTH_SECRET}"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET}"
    expose:
      - "3001"
    ports:
      - "${HOST_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.calafrio-web.rule=Host(`${DOMAIN:-calafrio.localhost}`)
      - traefik.http.routers.calafrio-web.entrypoints=web
      - traefik.http.routers.calafrio-web.middlewares=redirect-to-https@file
      - traefik.http.routers.calafrio-web.service=calafrio-web
      - traefik.http.services.calafrio-web.loadbalancer.server.port=3001
      - traefik.http.routers.calafrio-websecure.rule=Host(`${DOMAIN:-calafrio.localhost}`)
      - traefik.http.routers.calafrio-websecure.entrypoints=websecure
      - traefik.http.routers.calafrio-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.calafrio-websecure.service=calafrio-websecure
      - traefik.http.services.calafrio-websecure.loadbalancer.server.port=3001
      - traefik.http.services.calafrio-web.loadbalancer.passhostheader=true
      - traefik.http.services.calafrio-websecure.loadbalancer.passhostheader=true

networks:
  dokploy-network:
    name: dokploy-network
    external: true

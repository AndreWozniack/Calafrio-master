# Dev com hot reload e Postgres local: docker compose -f docker-compose.dev.yml up
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: calafrio
      POSTGRES_PASSWORD: calafrio_secret
      POSTGRES_DB: calafrio
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calafrio -d calafrio"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${HOST_PORT:-3001}:3001"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: "postgresql://calafrio:calafrio_secret@db:5432/calafrio"
      AUTH_SECRET: "${AUTH_SECRET:-calafrio-dev-secret-jwt-key-super-secure-token-2026}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      # node_modules do container (não sobrescreve com o do macOS)
      - node_modules_root:/app/node_modules
      - node_modules_web:/app/apps/web/node_modules
      - node_modules_core:/app/packages/core/node_modules
      - node_modules_ficha:/app/packages/ficha-app/node_modules
      - node_modules_tema:/app/packages/tema/node_modules
      - next_cache:/app/apps/web/.next

volumes:
  postgres_data:
  node_modules_root:
  node_modules_web:
  node_modules_core:
  node_modules_ficha:
  node_modules_tema:
  next_cache:
